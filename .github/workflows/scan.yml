name: Memecoin Scanner

# التشغيل الأساسي: repository_dispatch من cron-job.org (دقة بالثانية — بلا تأخر cron)
# الاحتياطي: schedule كل 15 دقيقة (يلا تعطلت الخدمة الخارجية) + زر يدوي
# (المستودع عام = دقائق Actions غير محدودة مجاناً)
on:
  repository_dispatch:
    types: [scan]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# جولة واحدة في المرة: يلا تداخلت جولتان، الثانية تنتظر (حماية لحالة Gist)
concurrency:
  group: memecoin-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: استعادة حالة البوت (cache مجاني — بلا آلاف الـcommits)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل الفحص
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # جسر أخبار X عبر Telegram (اختياري — يُتجاهل بصمت إن لم توجد الأسرار)
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          XBRIDGE_CHANNELS: ${{ secrets.XBRIDGE_CHANNELS }}

      - name: حفظ الحالة في الـcache للجولة القادمة
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
