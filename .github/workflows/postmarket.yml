name: Post-Market Analysis

# تقرير ما بعد السوق اليومي: 22:59 UTC = 23:59 بتوقيت المغرب
# (قد يتأخر بضع دقائق حسب ازدحام GitHub)
on:
  schedule:
    - cron: "59 22 * * *"
  workflow_dispatch:

# نفس مجموعة الفحص: يعمل وحده لتفادي التعارض على حالة Gist
concurrency:
  group: memecoin-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    # حماية: أي جولة عالقة تُقتل بعد 10 دقائق
    timeout-minutes: 10
    steps:
      - name: جلب الكود
        # actions/checkout@v4 مثبت على SHA (تحقق 2026-09-23)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: استعادة حالة البوت
        # actions/cache@v4 مثبت على SHA
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: تثبيت Python
        # actions/setup-python@v5 مثبت على SHA
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تحليل اليوم وإرسال التقرير
        run: python postmarket.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # اختياري: إن كان البوت يعمل على خادوم خاص مع Ollama
          # OLLAMA_HOST: http://localhost:11434
          # OLLAMA_MODEL: llama3.1

      - name: حفظ الحالة للجولة القادمة
        # actions/cache@v4 مثبت على SHA
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
